aid: shriramfinance
name: Shriram Finance
description: 'Shriram Finance Limited is one of India''s largest retail non-banking
  financial companies (NBFC), with roughly Rs 3.02 lakh crore in assets under management
  and 3,225 branches nationwide. It offers commercial-vehicle, two-wheeler, used-car,
  personal, business and gold loans, fixed deposits and fixed investment plans, general
  and life insurance distribution, Bharat BillPay (BBPS) bill payments, and UPI through
  its Shriram One app. The company runs consumer web and mobile products but publishes
  no public developer API, developer portal, or OpenAPI specification; a partner portal
  and a lending-service-provider program serve authorized business partners only.'
